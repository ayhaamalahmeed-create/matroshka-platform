<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة التحديد الكمي الذكي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b0f19; font-family: system-ui, -apple-system, sans-serif; }
    .glass-card { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glow-btn { box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
    .vip-badge { background: linear-gradient(135deg, #f59e0b, #d97706); }
  </style>
</head>
<body class="text-gray-100 min-h-screen pb-24">

  <!-- ==================== 1. صفحة التسجيل والدخول ==================== -->
  <div id="auth-page" class="max-w-md mx-auto p-6 min-h-screen flex flex-col justify-center">
    <div class="text-center mb-6">
      <div class="w-16 h-16 bg-gradient-to-tr from-emerald-500 to-teal-300 rounded-2xl mx-auto flex items-center justify-center text-gray-900 text-2xl font-bold mb-3 shadow-lg">
        <i class="fa-solid fa-chart-line"></i>
      </div>
      <h1 class="text-2xl font-bold text-white">منصة التحديد الكمي</h1>
      <p id="auth-subtitle" class="text-gray-400 text-sm mt-1">سجل دخولك لبدء متابعة المؤشرات</p>
    </div>

    <div class="flex bg-gray-900/80 p-1 rounded-xl mb-4 border border-gray-800">
      <button id="btn-show-login" onclick="switchAuthMode('login')" class="w-1/2 py-2 rounded-lg text-xs font-bold bg-emerald-500 text-gray-950 transition">تسجيل الدخول</button>
      <button id="btn-show-register" onclick="switchAuthMode('register')" class="w-1/2 py-2 rounded-lg text-xs font-bold text-gray-400 hover:text-white transition">إنشاء حساب جديد</button>
    </div>

    <div class="glass-card p-6 rounded-3xl space-y-4">
      <div>
        <label class="block text-xs text-gray-400 mb-1">البر
