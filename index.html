<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التحديد الكمي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0e14;
            --bg-card: #182232;
            --accent: #f0b90b;
            --text-main: #ffffff;
            --text-sec: #848e9c;
            --border: #232d3f;
            --green: #0ecb81;
            --red: #f6465d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding-bottom: 70px; }
        
        .main-container { max-width: 480px; margin: 0 auto; padding: 20px; }
        .card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 15px; }
        
        /* Form & Inputs */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--text-sec); font-size: 0.85rem; }
        .form-control, .form-select { width: 100%; padding: 12px; background: #121824; border: 1px solid var(--border); border-radius: 8px; color: #fff; outline: none; font-size: 0.9rem; }
        .form-control:focus, .form-select:focus { border-color: var(--accent); }
        
        /* Buttons */
        .btn { padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
        .btn-primary { background-color: var(--accent); color: #000; }
        .btn-success { background-color: var(--green); color: #fff; }
        .btn-danger { background-color: var(--red); color: #fff; }
        .btn-block { width: 100%; }
        .btn:hover { opacity: 0.9; }

        /* Withdrawals Ticker */
        .withdraw-ticker {
            background: #121824;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 0.85rem;
            color: var(--text-sec);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            white-space: nowrap;
        }
        .ticker-content {
            display: inline-block;
            animation: marquee 15s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--bg-card);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 999;
        }
        .nav-item {
            text-align: center;
            color: var(--text-sec);
            cursor: pointer;
            font-size: 0.75rem;
            background: none;
            border: none;
        }
        .nav-item.active { color: var(--accent); }
        .nav-item i { display: block; font-size: 1.2rem; margin-bottom: 3px; }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { width: 100%; max-width: 400px; }
        
        .hidden { display: none !important; }
        .text-accent { color: var(--accent); }
        .text-success { color: var(--green); }
        .text-danger { color: var(--red); }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- شاشة تسجيل الدخول / التسجيل -->
        <div id="authScreen" class="card" style="margin-top: 50px;">
            <h2 style="text-align: center; color: var(--accent); margin-bottom: 20px;">منصة التحديد الكمي</h2>
            
            <div id="loginForm">
                <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="loginEmail" class="form-control" placeholder="name@example.com"></div>
                <div class="form-group"><label>كلمة المرور</label><input type="password" id="loginPassword" class="form-control" placeholder="******"></div>
                <button class="btn btn-primary btn-block" onclick="login()">دخول</button>
                <p style="text-align: center; margin-top: 15px; font-size: 0.85rem; cursor: pointer; color: var(--accent);" onclick="toggleAuthMode()">ليس لديك حساب؟ سجل الآن</p>
            </div>

            <div id="registerForm" class="hidden">
                <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="regEmail" class="form-control" placeholder="name@example.com"></div>
                <div class="form-group"><label>كلمة المرور</label><input type="password" id="regPassword" class="form-control" placeholder="******"></div>
                <button class="btn btn-primary btn-block" onclick="register()">إنشاء حساب جديد (برصيد 0)</button>
                <p style="text-align: center; margin-top: 15px; font-size: 0.85rem; cursor: pointer; color: var(--accent);" onclick="toggleAuthMode()">لديك حساب بالفعل؟ سجل دخول</p>
            </div>
        </div>

        <!-- واجهة المنصة الرئيسية (تظهر بعد الدخول) -->
        <div id="appScreen" class="hidden">
            
            <!-- الهيدر العلوي -->
            <div class="card" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 20px;">
                <div>
                    <span style="font-size: 0.75rem; color: var(--text-sec);">مرحباً بك</span> (<span id="userVipBadge" class="text-accent">VIP 1</span>)
                    <div id="userDisplayEmail" style="font-weight: bold; font-size: 0.85rem;" class="text-accent"></div>
                </div>
                <button class="btn btn-danger" style="padding: 6px 12px; font-size: 0.75rem;" onclick="logout()">خروج</button>
            </div>

            <!-- شريط السحوبات المتحرك -->
            <div class="withdraw-ticker">
                <i class="fas fa-bullhorn text-accent"></i>
                <div style="overflow: hidden; width: 100%;">
                    <span class="ticker-content">تم سحب 150 USDT بنجاح • تم إيداع 50 USDT بنجاح • تم سحب 300 USDT بنجاح</span>
                </div>
            </div>

            <!-- بطاقة الرصيد الأساسية -->
            <div class="card" style="text-align: center; padding: 35px 20px;">
                <div style="color: var(--text-sec); font-size: 0.9rem; margin-bottom: 5px;">رصيد الحساب الحالي</div>
                <h1 id="userBalance" style="font-size: 3rem; margin-bottom: 25px;" class="text-accent">0.00</h1>
                
                <div style="display: flex; gap: 15px;">
                    <button class="btn btn-success btn-block" onclick="openModal('depositModal')">
                        <i class="fas fa-wallet"></i> إيداع
                    </button>
                    <button class="btn btn-danger btn-block" onclick="openModal('withdrawModal')">
                        <i class="fas fa-money-bill-transfer"></i> سحب
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div id="bottomNav" class="bottom-nav hidden">
        <button class="nav-item active">
            <i class="fas fa-home"></i>الرئيسية
        </button>
        <button class="nav-item">
            <i class="fas fa-robot"></i>التحديد
        </button>
        <button class="nav-item">
            <i class="fas fa-crown"></i>VIP
        </button>
        <button class="nav-item">
            <i class="fas fa-user"></i>الملف
        </button>
    </div>

    <!-- نافذة الإيداع -->
    <div id="depositModal" class="modal-overlay">
        <div class="modal-content card">
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                <h4>طلب إيداع رصيد USDT</h4>
                <i class="fas fa-times" style="cursor: pointer; color: var(--text-sec)" onclick="closeModal('depositModal')"></i>
            </div>
            <div class="form-group">
                <label>اختر شبكة الإيداع</label>
                <select class="form-select">
                    <option value="TRC20">TRC20 (Tron)</option>
                    <option value="BEP20">BEP20 (BSC)</option>
                </select>
            </div>
            <div class="form-group">
                <label>المبلغ (USDT)</label>
                <input type="number" id="depositAmount" class="form-control" placeholder="10">
            </div>
            <button class="btn btn-success btn-block" onclick="submitDeposit()">تأكيد طلب الإيداع</button>
        </div>
    </div>

    <!-- نافذة السحب -->
    <div id="withdrawModal" class="modal-overlay">
        <div class="modal-content card">
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                <h4>طلب سحب الأرباح USDT</h4>
                <i class="fas fa-times" style="cursor: pointer; color: var(--text-sec)" onclick="closeModal('withdrawModal')"></i>
            </div>
            <div class="form-group">
                <label>المبلغ المراد سحبه</label>
                <input type="number" id="withdrawAmount" class="form-control" placeholder="10">
            </div>
            <div class="form-group">
                <label>عنوان المحفظة المستقبلة</label>
                <input type="text" class="form-control" placeholder="أدخل عنوان محفظتك...">
            </div>
            <button class="btn btn-danger btn-block" onclick="submitWithdraw()">تأكيد طلب السحب</button>
        </div>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('quant_users')) || {};
        let currentUserEmail = localStorage.getItem('quant_current_user') || null;

        window.onload = function() {
            if (currentUserEmail && users[currentUserEmail]) {
                showAppScreen();
            }
        };

        function toggleAuthMode() {
            document.getElementById('loginForm').classList.toggle('hidden');
            document.getElementById('registerForm').classList.toggle('hidden');
        }

        function register() {
            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            const password = document.getElementById('regPassword').value.trim();

            if (!email || !password) { alert('يرجى ملء الحقول'); return; }
            if (users[email]) { alert('البريد مسجل بالفعل'); return; }

            users[email] = {
                email: email,
                password: password,
                balance: 0.0,
                vip: 1
            };
            currentUserEmail = email;
            localStorage.setItem('quant_current_user', currentUserEmail);
            localStorage.setItem('quant_users', JSON.stringify(users));
            showAppScreen();
        }

        function login() {
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value.trim();

            if (users[email] && users[email].password === password) {
                currentUserEmail = email;
                localStorage.setItem('quant_current_user', currentUserEmail);
                showAppScreen();
            } else {
                alert('بيانات الدخول غير صحيحة');
            }
        }

        function logout() {
            currentUserEmail = null;
            localStorage.removeItem('quant_current_user');
            location.reload();
        }

        function showAppScreen() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('appScreen').classList.remove('hidden');
            document.getElementById('bottomNav').classList.remove('hidden');
            
            const user = users[currentUserEmail];
            document.getElementById('userDisplayEmail').innerText = user.email;
            document.getElementById('userBalance').innerText = user.balance.toFixed(2) + " USDT";
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function submitDeposit() {
            const amount = parseFloat(document.getElementById('depositAmount').value);
            if (!amount || amount <= 0) { alert('أدخل مبلغ صحيح'); return; }
            
            const user = users[currentUserEmail];
            user.balance += amount; // إضافة الإيداع للرصيد
            localStorage.setItem('quant_users', JSON.stringify(users));
            
            showAppScreen();
            closeModal('depositModal');
            alert(`تم إيداع ${amount} USDT بنجاح إلى رصيدك!`);
        }

        function submitWithdraw() {
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const user = users[currentUserEmail];

            if (!amount || amount <= 0) { alert('أدخل مبلغ صحيح'); return; }
            if (amount > user.balance) { alert('رصيدك غير كافي'); return; }

            user.balance -= amount;
            localStorage.setItem('quant_users', JSON.stringify(users));

            showAppScreen();
            closeModal('withdrawModal');
            alert(`تم سحب ${amount} USDT بنجاح!`);
        }
    </script>
</body>
</html>
