<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 2rem; }

        h1 { color: #38bdf8; }
        .badge { background: #22c55e; color: #000; padding: 0.2rem 0.6rem; border-radius: 20px; font-weight: bold; }

<body>
    <h1>منصة ماتروشكا (Matryoshka)</h1>
    <p><span class="badge">النظام يعمل بنجاح</span></p>
    
    <div class="card">
        <h3>📊 التحليل المالي والتداول (Quant Trading)</h3>
        <p>جاري إعداد المؤشرات والخوارزميات البرمجية...</p>
    </div>

    <div class="card">
        <h3>📋 إدارة المهام (Task Management)</h3>
        <p>لوحة تحكم المهام اليومية والمشاريع.</p>
    </div>
