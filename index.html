<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة التحديد الكمي الذكي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b0f19; font-family: system-ui, -apple-system, sans-serif; }
    .glass-card { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glow-btn { box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
  </style>
</head>
<body class="text-gray-100 min-h-screen pb-20">

  <!-- ==================== 1. صفحة تسجيل الدخول / إنشاء حساب ==================== -->
  <div id="auth-page" class="max-w-md mx-auto p-6 min-h-screen flex flex-col justify-center">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-gradient-to-tr from-emerald-500 to-teal-300 rounded-2xl mx-auto flex items-center justify-center text-gray-900 text-2xl font-bold mb-3 shadow-lg">
        <i class="fa-solid fa-chart-line"></i>
      </div>
      <h1 class="text-2xl font-bold text-white">منصة التحديد الكمي</h1>
      <p class="text-gray-400 text-sm mt-1">سجل دخولك لبدء متابعة المؤشرات</p>
    </div>

    <div class="glass-card p-6 rounded-3xl space-y-4">
      <div>
        <label class="block text-xs text-gray-400 mb-1">البريد الإلكتروني</label>
        <input type="email" id="email-input" placeholder="example@mail.com" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-white">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">كلمة المرور</label>
        <input type="password" id="pass-input" placeholder="••••••••" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-white">
      </div>
      <button onclick="login()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-bold py-3 rounded-xl transition glow-btn mt-2">
        تسجيل الدخول
      </button>
    </div>
  </div>

  <!-- ==================== 2. الواجهة الرئيسية (تظهر بعد الدخول) ==================== -->
  <div id="main-app" class="hidden max-w-md mx-auto p-4 space-y-4">
    
    <!-- الهيدر -->
    <header class="flex justify-between items-center py-2 px-1">
      <div class="flex items-center space-x-3 space-x-reverse">
        <div class="w-10 h-10 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center border border-emerald-500/30">
          <i class="fa-solid fa-user"></i>
        </div>
        <div>
          <p class="text-xs text-gray-400">مرحباً بك</p>
          <p id="user-display" class="text-sm font-bold text-white">المستخدم</p>
        </div>
      </div>
      <button onclick="logout()" class="text-gray-400 hover:text-red-400 text-sm p-2">
        <i class="fa-solid fa-right-from-bracket"></i> خروج
      </button>
    </header>

    <!-- اقتباسات حية للأسعار (تتحدث تلقائياً) -->
    <div class="glass-card p-4 rounded-2xl">
      <h3 class="text-xs font-semibold text-gray-400 mb-3 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> اقتباسات حية للأسعار
      </h3>
      <div class="space-y-3">
        <div class="flex justify-between items-center bg-gray-900/50 p-3 rounded-xl border border-gray-800">
          <span class="font-bold text-sm">BTC / USDT</span>
          <span id="btc-price" class="font-mono text-emerald-400 font-bold">$84,679.00</span>
        </div>
        <div class="flex justify-between items-center bg-gray-900/50 p-3 rounded-xl border border-gray-800">
          <span class="font-bold text-sm">ETH / USDT</span>
          <span id="eth-price" class="font-mono text-emerald-400 font-bold">$2,693.96</span>
        </div>
      </div>
    </div>

    <!-- بطاقة الحساب -->
    <div class="glass-card p-5 rounded-2xl relative overflow-hidden">
      <div class="flex justify-between items-start mb-4">
        <div>
          <p class="text-xs text-gray-400">إجمالي الأصول</p>
          <p id="balance" class="text-2xl font-extrabold text-white mt-1">$100.00 <span class="text-xs text-gray-400 font-normal">USDT</span></p>
        </div>
        <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs px-2.5 py-1 rounded-full font-medium">نشط</span>
      </div>

      <!-- أزرار تفاعلية تفتح نافذة منبثقة -->
      <div class="grid grid-cols-2 gap-3 mt-4">
        <button onclick="openModal('إيداع')" class="bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-bold py-2.5 rounded-xl text-sm transition text-center">
          <i class="fa-solid fa-arrow-down-left ml-1"></i> إيداع
        </button>
        <button onclick="openModal('سحب')" class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-2.5 rounded-xl text-sm border border-gray-700 transition text-center">
          <i class="fa-solid fa-arrow-up-right ml-1"></i> سحب
        </button>
      </div>
    </div>

  </div>

  <!-- ==================== 3. النافذة المنبثقة التفاعلية ==================== -->
  <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="glass-card p-6 rounded-3xl w-full max-w-sm space-y-4">
      <div class="flex justify-between items-center">
        <h3 id="modal-title" class="text-lg font-bold text-white">عنوان العملية</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">المبلغ (USDT)</label>
        <input type="number" id="amount-input" placeholder="0.00" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-white">
      </div>
      <button onclick="processTransaction()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-bold py-3 rounded-xl transition">
        تأكيد الطلب
      </button>
    </div>
  </div>

  <!-- البرمجة التفاعلية -->
  <script>
    let currentBalance = 100.00;
    let currentAction = '';

    function login() {
      const email = document.getElementById('email-input').value;
      if (email) {
        document.getElementById('user-display').innerText = email.split('@')[0];
        document.getElementById('auth-page').classList.add('hidden');
        document.getElementById('main-app').classList.remove('hidden');
      } else {
        alert('يرجى إدخال البريد الإلكتروني');
      }
    }

    function logout() {
      document.getElementById('main-app').classList.add('hidden');
      document.getElementById('auth-page').classList.remove('hidden');
    }

    function openModal(action) {
      currentAction = action;
      document.getElementById('modal-title').innerText = 'طلب ' + action;
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('modal').classList.remove('flex');
    }

    function processTransaction() {
      const val = parseFloat(document.getElementById('amount-input').value);
      if (val && val > 0) {
        if (currentAction === 'إيداع') {
          currentBalance += val;
        } else if (currentAction === 'سحب') {
          if (val > currentBalance) {
            alert('الرصيد غير كافٍ');
            return;
          }
          currentBalance -= val;
        }
        document.getElementById('balance').innerText = '$' + currentBalance.toFixed(2) + ' USDT';
        alert('تم تنفيذ طلب ' + currentAction + ' بنجاح!');
        document.getElementById('amount-input').value = '';
        closeModal();
      } else {
        alert('يرجى إدخال مبلغ صحيح');
      }
    }

    // تحديث تفاعلي تلقائي للأسعار كل ثانيتين
    setInterval(() => {
      const btc = (84600 + Math.random() * 200).toFixed(2);
      const eth = (2690 + Math.random() * 10).toFixed(2);
      document.getElementById('btc-price').innerText = '$' + btc;
      document.getElementById('eth-price').innerText = '$' + eth;
    }, 2000);
  </script>
</body>
</html>
